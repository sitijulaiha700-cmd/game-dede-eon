<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Virtual Pet Dede Eon & Leon ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        
        html, body { 
            width: 100%; height: 100%; 
            overflow: hidden; 
            font-family: "Quicksand", sans-serif; 
            background: #1a0826; color: #2f3542; 
            display: flex; justify-content: center; align-items: center;
        }

        #bgCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        /* SCALER WRAPPER: OTOMATIS MENYESUAIKAN UKURAN DI HP & LAPTOP */
        .game-scaler {
            position: relative;
            z-index: 10;
            width: 360px;
            height: 640px;
            transform-origin: center center;
        }

        /* GAME CARD */
        .game-card { 
            background: rgba(255, 255, 255, 0.98); 
            backdrop-filter: blur(10px); 
            width: 100%; height: 100%; 
            border-radius: 20px; 
            border: 4px solid #2c3e50; 
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5); 
            display: flex; flex-direction: column; 
            overflow: hidden; position: relative; 
        }

        /* AUTH CARD */
        .auth-card { background: #ffffff; width: 340px; border-radius: 20px; padding: 18px; text-align: center; border: 4px solid #ff758c; box-shadow: 0 15px 35px rgba(255, 117, 140, 0.4); z-index: 20; }
        .auth-title { font-family: "Fredoka One", cursive; color: #ff4757; font-size: 1.4rem; margin-bottom: 4px; }
        .auth-desc { font-size: 0.78rem; color: #57606f; margin-bottom: 10px; font-weight: 700; }
        .input-group { text-align: left; margin-bottom: 8px; }
        .input-group label { font-size: 0.72rem; font-weight: 700; color: #ff4757; margin-left: 4px; margin-bottom: 2px; display: block; }
        .input-group input, .input-group select { width: 100%; padding: 8px 10px; border: 2px solid #ff758c; border-radius: 12px; font-family: "Quicksand", sans-serif; font-size: 0.82rem; outline: none; background: #fff; }
        .btn-auth { background: linear-gradient(135deg, #ff758c, #ff4757); color: #fff; border: none; padding: 9px; font-family: "Fredoka One", cursive; font-size: 0.95rem; border-radius: 20px; cursor: pointer; width: 100%; margin-top: 4px; box-shadow: 0 3px 0 #d63031; }
        .auth-link { margin-top: 8px; font-size: 0.75rem; color: #ff4757; font-weight: 700; cursor: pointer; text-decoration: underline; display: inline-block; }

        /* TOP BAR */
        .top-bar { display: flex; justify-content: space-between; align-items: center; background: #2c3e50; color: #fff; padding: 6px 10px; border-bottom: 3px solid #1a252f; font-family: "Fredoka One", cursive; font-size: 0.82rem; z-index: 15; flex-shrink: 0; }
        .top-info { display: flex; align-items: center; gap: 6px; }
        .pet-name-tag { cursor: pointer; text-decoration: underline; color: #ffeaa7; }
        .coin-pill { background: #f1c40f; color: #2c3e50; padding: 2px 8px; border-radius: 10px; border: 2px solid #f39c12; font-size: 0.78rem; }

        /* ROOM STAGE */
        .room-stage { flex: 1; position: relative; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        .room-dapur { background: radial-gradient(circle, #fff3e0 20%, #ffe0b2 100%); }
        .room-tidur { background: radial-gradient(circle, #81ecec 20%, #74b9ff 100%); }
        .room-mandi { background: radial-gradient(circle, #ffccd5 20%, #ff85a1 100%); }
        .room-klinik { background: radial-gradient(circle, #e8f5e9 20%, #a5d6a7 100%); }
        .room-toko { background: radial-gradient(circle, #fce4ec 20%, #f8bbd0 100%); }
        .room-curhat { background: radial-gradient(circle, #f3e5f5 20%, #e1bee7 100%); }

        .room-floor { position: absolute; bottom: 0; left: 0; width: 100%; height: 28%; z-index: 3; }
        .room-dapur .room-floor { background: repeating-linear-gradient(90deg, #d35400, #d35400 35px, #e67e22 35px, #e67e22 70px); border-top: 4px solid #a04000; }
        .room-tidur .room-floor { background: repeating-linear-gradient(90deg, #8e583c, #8e583c 45px, #a06646 45px, #a06646 90px); border-top: 4px solid #5c3826; }
        .room-mandi .room-floor { background: repeating-linear-gradient(0deg, #bb2d3b, #bb2d3b 25px, #d63845 25px, #d63845 50px); border-top: 4px solid #842029; }
        .room-klinik .room-floor { background: repeating-linear-gradient(90deg, #27ae60, #27ae60 35px, #2ecc71 35px, #2ecc71 70px); border-top: 4px solid #1e8449; }
        .room-toko .room-floor { background: repeating-linear-gradient(90deg, #c2185b, #c2185b 35px, #e91e63 35px, #e91e63 70px); border-top: 4px solid #880e4f; }
        .room-curhat .room-floor { background: repeating-linear-gradient(90deg, #6a1b9a, #6a1b9a 35px, #8e24aa 35px, #8e24aa 70px); border-top: 4px solid #4a148c; }

        .left-stats { position: absolute; top: 6px; left: 6px; display: flex; flex-direction: column; gap: 5px; z-index: 10; }
        .stat-icon-btn { width: 32px; height: 32px; background: #fff; border: 2px solid #2f3542; border-radius: 9px; display: flex; justify-content: center; align-items: center; position: relative; box-shadow: 0 2px 0 #2f3542; cursor: pointer; }
        .stat-meter-fill { position: absolute; bottom: 0; left: 0; width: 100%; background: rgba(231, 76, 60, 0.4); border-radius: 0 0 7px 7px; }

        .right-menu { position: absolute; top: 6px; right: 6px; display: flex; flex-direction: column; gap: 5px; z-index: 10; }
        .util-btn { width: 32px; height: 32px; background: #fff; border: 2px solid #2f3542; border-radius: 9px; display: flex; justify-content: center; align-items: center; box-shadow: 0 2px 0 #2f3542; cursor: pointer; }

        /* PET AVATAR FIXED SIZE INSIDE SCALER */
        .pet-container { position: relative; z-index: 6; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .pet-avatar { width: 110px; height: 110px; position: relative; animation: petBobbing 3s ease-in-out infinite; }
        @keyframes petBobbing { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
        
        .acc-layer { position: absolute; pointer-events: none; transform: translateX(-50%); left: 50%; text-align: center; }
        .pet-hat { top: -10px; font-size: 2.2rem; z-index: 9; }
        .pet-glasses { top: 32px; font-size: 1.6rem; z-index: 8; }
        .pet-earring { top: 22px; right: 6px; left: auto; transform: none; font-size: 0.85rem; z-index: 9; }
        .pet-facial { top: 48px; font-size: 1.3rem; z-index: 8; }

        /* BOTTOM AREA */
        .bottom-control-area { background: #2c3e50; border-top: 3px solid #1a252f; padding: 6px; display: flex; flex-direction: column; gap: 4px; z-index: 15; flex-shrink: 0; }
        .room-nav { display: flex; justify-content: space-between; align-items: center; background: #34495e; border-radius: 8px; padding: 3px 6px; border: 1.5px solid #1a252f; }
        .nav-arrow { background: #f1c40f; border: 1.5px solid #f39c12; color: #2c3e50; width: 28px; height: 28px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .room-title { font-family: "Fredoka One", cursive; color: #fff; font-size: 0.85rem; }

        .item-shelf { background: #ecf0f1; border-radius: 9px; padding: 4px; height: 75px; border: 1.5px solid #bdc3c7; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; align-items: center; }
        .shelf-item { background: #fff; border: 1.5px solid #2f3542; border-radius: 7px; padding: 3px; text-align: center; cursor: pointer; font-size: 0.6rem; font-weight: 700; display: flex; flex-direction: column; align-items: center; }
        .shelf-icon { font-size: 1rem; }

        .shop-nav-bar { grid-column: span 4; display: flex; gap: 3px; overflow-x: auto; padding-bottom: 2px; }
        .shop-cat-btn { background: #fff; border: 1px solid #2f3542; border-radius: 5px; padding: 2px 4px; font-size: 0.55rem; font-weight: bold; cursor: pointer; }
        .shop-cat-btn.active { background: #ff758c; color: #fff; }

        .curhat-shelf-box { grid-column: span 4; display: flex; flex-direction: column; gap: 2px; height: 65px; }
        .curhat-history-box { flex: 1; background: #fff; border: 1.5px solid #2f3542; border-radius: 6px; padding: 3px; overflow-y: auto; font-size: 0.6rem; display: flex; flex-direction: column; gap: 2px; }
        .chat-bubble { padding: 2px 5px; border-radius: 5px; max-width: 90%; font-size: 0.58rem; }
        .chat-bubble.user { background: #ffeaa7; align-self: flex-end; }
        .chat-bubble.admin { background: #d4edda; align-self: flex-start; }

        .toast-container { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 100; width: 280px; pointer-events: none; }
        .toast-box { background: rgba(44, 62, 80, 0.95); border: 2px solid #ffeaa7; color: #fff; padding: 6px 10px; border-radius: 12px; font-size: 0.7rem; font-weight: 700; display: flex; align-items: center; gap: 6px; }

        .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 100; display: flex; justify-content: center; align-items: center; color: white; font-weight: 700; }
    </style>
</head>
<body>
    <canvas id="bgCanvas"></canvas>

    <div class="loading-overlay" id="loading" style="display:none;">
        <div id="loadingText">Menghubungkan ke Server...</div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <!-- WRAPPER UTAMA AUTO-SCALE -->
    <div class="game-scaler" id="gameScaler">
        <!-- FORM LOGIN -->
        <div class="auth-card" id="cardLogin">
            <div class="auth-title">Virtual Pet Dede Eon 🐾</div>
            <div class="auth-desc">Masuk untuk merawat Dede Eon & curhat ke Leon!</div>
            <div class="input-group">
                <label>Username:</label>
                <input type="text" id="loginUser" placeholder="Username..." />
            </div>
            <div class="input-group">
                <label>Password:</label>
                <input type="password" id="loginPass" placeholder="Masukkan password..." />
            </div>
            <button class="btn-auth" onclick="doLogin()">MASUK GAME ▶</button>
            <br>
            <span class="auth-link" onclick="showAuth('cardRegister')">Belum punya akun? Daftar</span>
        </div>

        <!-- FORM REGISTER -->
        <div class="auth-card" id="cardRegister" style="display:none;">
            <div class="auth-title">Daftar Akun Baru 🌟</div>
            <div class="input-group"><label>Username Baru:</label><input type="text" id="regUser" /></div>
            <div class="input-group"><label>Password:</label><input type="password" id="regPass" /></div>
            <div class="input-group">
                <label>Pertanyaan Keamanan:</label>
                <select id="regQ">
                    <option value="Hewan favorit?">Hewan favorit?</option>
                    <option value="Makanan favorit?">Makanan favorit?</option>
                </select>
            </div>
            <div class="input-group"><label>Jawaban:</label><input type="text" id="regA" /></div>
            <button class="btn-auth" onclick="doRegister()">DAFTAR AKUN ✨</button>
            <br><span class="auth-link" onclick="showAuth('cardLogin')">Kembali ke Login</span>
        </div>

        <!-- MAIN GAME PANEL -->
        <div class="game-card" id="cardGame" style="display:none;">
            <div class="top-bar">
                <div class="top-info">
                    <span class="pet-name-tag" onclick="editPetName()"><span id="txtPetName">Dede Eon</span> ✏️</span>
                    <span style="background:#ff758c; padding:1px 6px; border-radius:8px;" id="txtLvl">Lvl 1</span>
                </div>
                <div class="coin-pill">🪙 <span id="txtCoin">100</span></div>
            </div>

            <div class="room-stage room-dapur" id="roomStage">
                <div class="left-stats">
                    <div class="stat-icon-btn" onclick="switchRoom(0)"><div class="stat-meter-fill" id="fillLapar"></div>🍽️</div>
                    <div class="stat-icon-btn" onclick="switchRoom(1)"><div class="stat-meter-fill" id="fillEnergi"></div>💤</div>
                    <div class="stat-icon-btn" onclick="switchRoom(2)"><div class="stat-meter-fill" id="fillBersih"></div>🧼</div>
                    <div class="stat-icon-btn" onclick="switchRoom(3)"><div class="stat-meter-fill" id="fillSehat"></div>➕</div>
                </div>

                <div class="right-menu">
                    <div class="util-btn" onclick="switchRoom(4)">👛</div>
                    <div class="util-btn" onclick="switchRoom(5)">📜</div>
                    <div class="util-btn" onclick="doLogout()">🚪</div>
                </div>

                <div class="room-floor"></div>

                <div class="pet-container">
                    <div class="pet-avatar" id="petAvatar" onclick="petDedeEon()">
                        <div class="acc-layer pet-hat" id="accHat">👑</div>
                        <div class="acc-layer pet-glasses" id="accGlasses"></div>
                        <div class="acc-layer pet-facial" id="accFacial"></div>
                        <div class="acc-layer pet-earring" id="accEarring"></div>
                        <svg viewBox="0 0 120 120" width="100%" height="100%">
                            <circle cx="60" cy="65" r="42" fill="#ff758c"/>
                            <circle cx="45" cy="60" r="6" fill="#2f3542"/>
                            <circle cx="75" cy="60" r="6" fill="#2f3542"/>
                        </svg>
                    </div>
                </div>
            </div>

            <div class="bottom-control-area">
                <div class="room-nav">
                    <button class="nav-arrow" onclick="prevRoom()">◀</button>
                    <div class="room-title" id="roomTitle">🍽️ Dapur</div>
                    <button class="nav-arrow" onclick="nextRoom()">▶</button>
                </div>
                <div class="item-shelf" id="itemShelf"></div>
            </div>
        </div>
    </div>

    <script>
        // SCRIPT OTOMATIS AUTO-SCALE LAYAR
        function autoScaleGame() {
            var scaler = document.getElementById("gameScaler");
            var windowWidth = window.innerWidth;
            var windowHeight = window.innerHeight;

            var targetWidth = 360;
            var targetHeight = 640;

            var scaleX = windowWidth / targetWidth;
            var scaleY = windowHeight / targetHeight;
            
            // Ambil skala terkecil agar seluruh elemen 100% masuk tanpa terpotong
            var scale = Math.min(scaleX, scaleY, 1.2); 

            scaler.style.transform = "scale(" + scale + ")";
        }

        window.addEventListener("resize", autoScaleGame);
        window.addEventListener("load", autoScaleGame);
        autoScaleGame();

        // LOGIKA Sederhana Game
        var currentUser = null;
        var petData = { nama: "Dede Eon", level: 1, koin: 100, lapar: 100, energi: 100, bersih: 100, sehat: 100 };

        function showAuth(id) {
            document.getElementById("cardLogin").style.display = "none";
            document.getElementById("cardRegister").style.display = "none";
            document.getElementById(id).style.display = "block";
        }

        function doLogin() {
            currentUser = document.getElementById("loginUser").value || "User";
            document.getElementById("gameScaler").querySelector("#cardLogin").style.display = "none";
            document.getElementById("cardGame").style.display = "flex";
            autoScaleGame();
        }

        function doLogout() {
            document.getElementById("cardGame").style.display = "none";
            document.getElementById("cardLogin").style.display = "block";
            autoScaleGame();
        }

        function switchRoom(idx) {
            var shelf = document.getElementById("itemShelf");
            shelf.innerHTML = `<div class="shelf-item" style="grid-column:span 4;">Menu Aktif</div>`;
        }

        function prevRoom() {} function nextRoom() {}
        function petDedeEon() {}
    </script>
</body>
</html>
